<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM · CreceConAds</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* CRM privado. Vista «Hoy» (a quién escribirle) y tablero por etapa; acciones rápidas sin abrir la ficha. Tokens de la web. */
:root{--night:#0A0F1F;--night-2:#101731;--night-3:#18213F;--edge:#24315A;--text:#EEF1FA;--soft:#A3ACC8;--blue:#2F5BFF;--blue-2:#6D8BFF;--green:#2FD08F;--green-bg:rgba(47,208,143,.12);--bad:#FF7A70;--bad-bg:rgba(255,122,112,.14);--warn:#F2C14E;
--display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-2)}
.wrap{max-width:1400px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-size:24px;margin:0;letter-spacing:-.02em}
h2{font-family:var(--display);font-size:18px;margin:0 0 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top .acc{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 14px;min-height:44px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.l{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge);color:var(--text)}
.btn.peligro{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1.5px rgba(255,122,112,.4)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
.vistas{display:flex;gap:6px;margin:0 0 12px}
.vistas button{border:1px solid var(--edge);background:var(--night-2);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;font-weight:700}
.vistas button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--night-2);border:1px solid var(--edge);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:500 20px var(--mono)}
.kpi span{color:var(--soft);font-size:13px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros input,.filtros select{background:var(--night-2);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;min-height:44px}
.filtros input{flex:1;min-width:200px}
.aviso{position:sticky;top:8px;z-index:5;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.aviso.ok{background:var(--green-bg);color:var(--green)}
.aviso.err{background:var(--bad-bg);color:var(--bad)}
.aviso button{background:none;border:0;cursor:pointer;color:inherit;font-weight:700;min-height:32px}
/* Hoy */
.hoy{display:grid;gap:14px}
.lista{background:var(--night-2);border:1px solid var(--edge);border-radius:14px;padding:12px}
.lista h2{display:flex;align-items:center;gap:8px}
.tanda h2 .n,.lista h2 .n{font:500 13px var(--mono);color:var(--soft)}
.lista.vencidos h2{color:var(--bad)}
.filas{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;background:var(--night);border-radius:10px;padding:8px 10px}
.vencidos .fila{box-shadow:inset 3px 0 0 var(--bad)}
.fila-abrir{all:unset;cursor:pointer;display:grid;gap:2px;min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;padding:4px 2px;border-radius:6px}
.fila-abrir b{font-size:16px}
.fila-abrir .paso{color:var(--soft);font-size:14px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--soft)}
.acciones{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.acciones button,.acciones a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 10px;border-radius:9px;border:1px solid var(--edge);background:var(--night-2);color:var(--text);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}
.acciones .hecho{background:var(--green-bg);border-color:rgba(47,208,143,.4);color:var(--green)}
.acciones .perdido{color:var(--bad)}
.vacio{color:var(--soft);font-size:14px;padding:4px}
/* etiquetas */
.tag{display:inline-block;font:500 11px var(--mono);padding:1px 7px;border-radius:99px;background:var(--night-3);color:var(--soft)}
.c-instagram{background:rgba(109,139,255,.18);color:var(--blue-2)}
.c-linkedin{background:rgba(47,91,255,.25);color:#C9D4FF}
.c-mail{background:var(--night-3);color:var(--text)}
.c-whatsapp{background:var(--green-bg);color:var(--green)}
.c-web{background:rgba(242,193,78,.14);color:var(--warn)}
.tag.vence{background:var(--bad-bg);color:var(--bad)}
/* Tablero */
.tablero{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--night-2);border:1px solid var(--edge);border-radius:14px;padding:10px;display:flex;flex-direction:column;max-height:72vh}
.col h2{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:2px 4px 10px;display:flex;justify-content:space-between}
.col .cuerpo{overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-right:2px}
.col.plegada{max-height:none;min-width:0}
.plegar{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:4px;border-radius:6px;min-height:36px;align-items:center}
.card{border:1px solid var(--edge);background:var(--night);border-radius:10px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
.card .fila-abrir b{font-size:15px}
.card .acciones{justify-content:flex-start}
/* Tanda de mensajes */
.tanda{background:var(--night-2);border:1px solid var(--edge);border-radius:14px;padding:12px}
.restan{font:600 15px var(--body);margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.restan .barra{flex:1;min-width:120px;height:8px;border-radius:99px;background:var(--night-3);overflow:hidden}
.restan .barra i{display:block;height:100%;background:var(--green)}
.msj{background:var(--night);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.msj + .msj{margin-top:10px}
.msj .texto{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--night-2);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.5;margin:0}
.msj .asunto{font-size:13px;color:var(--soft);margin:0;overflow-wrap:anywhere}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tres button,.tres a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:6px 10px;border-radius:10px;border:1px solid var(--edge);background:var(--night-2);color:var(--text);font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.tres .copiar{background:var(--blue,#2F5BFF);border-color:transparent;color:#fff}
.tres .copiar.ok{background:var(--green-bg);color:var(--green)}
.tres .enviado{background:var(--green-bg);border-color:rgba(47,208,143,.4);color:var(--green)}
.tres [aria-disabled=true]{opacity:.45;cursor:not-allowed}
.secund{display:flex;gap:6px;flex-wrap:wrap}
.secund button{min-height:44px;padding:0 12px;border-radius:9px;border:1px solid var(--edge);background:none;color:var(--soft);font-weight:700;font-size:13px;cursor:pointer}
.aviso .deshacer{text-decoration:underline;margin-left:auto}
/* Diálogos */
dialog{background:var(--night-2);color:var(--text);border:1px solid var(--edge);border-radius:16px;width:min(720px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft)}
label input,label select,label textarea{background:var(--night);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;color:var(--text);min-height:44px}
.enlaces{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.hist{max-height:300px;overflow:auto;border-top:1px solid var(--edge);margin-top:12px;padding-top:8px;font-size:13px}
.hist p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}.hist time{color:var(--soft);font-family:var(--mono);font-size:12px}
.pie{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.pie div{display:flex;gap:8px;flex-wrap:wrap}
.atajos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.atajos button{border:1px solid var(--edge);background:var(--night);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.login{max-width:360px;margin:12vh auto;background:var(--night-2);border:1px solid var(--edge);border-radius:16px;padding:22px;display:grid;gap:12px}
.err{color:var(--bad);font-size:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.fila{grid-template-columns:1fr}.acciones{justify-content:flex-start}
  h1{font-size:20px}.top .btn{min-height:40px;padding:6px 12px;font-size:14px}
  .kpis{grid-template-columns:repeat(3,1fr);gap:6px}.kpi{padding:8px}.kpi b{font-size:17px}.kpi span{font-size:11px;line-height:1.3;display:block}
  .filtros input{flex:1 1 100%;min-width:0}.filtros select{flex:1 1 0;min-width:0}
  .tres{grid-template-columns:1fr}.tres button,.tres a{min-height:48px}.msj .texto{font-size:14px}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <form class="login" id="login">
    <h1>CRM · CreceConAds</h1>
    <label>Clave<input id="clave" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Entrar</button>
    <p class="err" id="login-err" role="alert" hidden></p>
  </form>
</main>

<dialog id="ficha" aria-labelledby="ficha-tit">
  <form method="dialog" id="ficha-form">
    <h2 id="ficha-tit">Contacto</h2>
    <div class="enlaces" id="ficha-enlaces"></div>
    <div class="grid2">
      <label>Nombre<input id="f-nombre"></label>
      <label>Marca o empresa<input id="f-marca"></label>
      <label>Canal<select id="f-canal"><option value="">Sin canal</option><option value="instagram">Instagram</option><option value="linkedin">LinkedIn</option><option value="mail">Mail</option><option value="whatsapp">WhatsApp</option><option value="web">Web</option><option value="otro">Otro</option></select></label>
      <label>Origen<select id="f-origen"><option value="pauta">Pauta</option><option value="prospeccion">Prospección</option><option value="web">Web</option><option value="referido">Referido</option><option value="otro">Otro</option></select></label>
      <label>Instagram<input id="f-instagram" placeholder="@usuario"></label>
      <label>LinkedIn<input id="f-linkedin" placeholder="https://www.linkedin.com/in/…"></label>
      <label>Web<input id="f-web"></label>
      <label>WhatsApp<input id="f-whatsapp"></label>
      <label>Mail<input id="f-email" type="email"></label>
      <label>Qué vende<input id="f-vende"></label>
      <label>Inversión en Meta por mes<input id="f-inversion"></label>
      <label>Etapa<select id="f-etapa"></select></label>
      <label>Próximo paso<input id="f-proximo_paso" placeholder="Ej.: mandar las 3 fugas"></label>
      <label>Fecha del próximo paso<input id="f-proximo_fecha" type="date"></label>
      <label>Valor mensual de la propuesta<input id="f-valor" placeholder="Solo si hay propuesta"></label>
      <label>Motivo si se perdió<input id="f-motivo_perdida"></label>
    </div>
    <label style="margin-top:10px">Mensaje para enviar hoy<textarea id="f-mensaje" rows="5" placeholder="El texto listo para copiar y mandar"></textarea></label>
    <label style="margin-top:10px">Asunto (solo si va por mail)<input id="f-asunto"></label>
    <label style="margin-top:10px">Notas<textarea id="f-notas" rows="7"></textarea></label>
    <label style="margin-top:10px">Agregar al historial<input id="f-nota" placeholder="Ej.: le mandé el seguimiento por mail"></label>
    <div class="hist" id="f-hist" aria-label="Historial"></div>
    <div class="pie"><button class="btn peligro" type="button" id="f-eliminar">Eliminar</button>
      <div><button class="btn l" value="cancelar" type="submit">Cerrar</button><button class="btn" value="guardar" id="f-guardar" type="submit">Guardar</button></div></div>
  </form>
</dialog>

<dialog id="rapida" aria-labelledby="rapida-tit">
  <form method="dialog" id="rapida-form">
    <h2 id="rapida-tit">Acción</h2>
    <div id="rapida-cuerpo"></div>
    <div class="pie"><span></span><div><button class="btn l" value="cancelar" type="submit">Cancelar</button><button class="btn" value="guardar" type="submit" id="rapida-ok">Guardar</button></div></div>
  </form>
</dialog>

<script>
(() => {
  const ETAPAS = ["Nuevo", "Contactado", "Ideas enviadas", "Llamada", "Propuesta", "Ganado", "Perdido"];
  const ABIERTAS = ETAPAS.slice(0, 5);
  const CANAL_TXT = { instagram: "Instagram", linkedin: "LinkedIn", mail: "Mail", whatsapp: "WhatsApp", web: "Web", otro: "Otro" };
  const ORIGEN_TXT = { pauta: "Pauta", prospeccion: "Prospección", web: "Web", referido: "Referido", otro: "Otro" };
  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const hoy = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10); // fecha de Argentina
  const sumar = (dias) => new Date(Date.now() - 3 * 3600e3 + dias * 86400e3).toISOString().slice(0, 10);
  let clave = "", contactos = [], actual = null, sucio = false;
  const estado = { vista: "hoy", q: "", origen: "", canal: "", plegadas: { Ganado: true, Perdido: true } };
  try { clave = sessionStorage.getItem("crm-clave") || ""; } catch (e) {}

  // ---------- datos derivados ----------
  function canalDe(c) {
    if (c.canal) return c.canal;
    const n = String(c.notas || "");
    const m = n.match(/canal:\s*(instagram|linkedin|mail|e-?mail|whatsapp|web)/i);
    if (m) return m[1].toLowerCase().replace(/^e-?mail$/, "mail");
    if (c.linkedin || /linkedin\.com/i.test(c.web || "")) return "linkedin";
    if (c.origen === "pauta" || c.origen === "web") return "web";
    if (c.instagram) return "instagram";
    return "";
  }
  const linkedinDe = (c) => c.linkedin || (/linkedin\.com/i.test(c.web || "") ? c.web : "");
  function tamano(c) {
    if (c.anuncios != null && c.anuncios !== "") return Number(c.anuncios) || 0;
    const m = String(c.notas || "").match(/anuncios activos[^:\d]*:?\s*(\d+)/i);
    return m ? Number(m[1]) : 0;
  }
  function ultimoContacto(c) {
    const h = Array.isArray(c.historial) ? c.historial : [];
    const f = h.length ? h[h.length - 1].fecha : c.actualizado || c.creado;
    if (!f) return null;
    return Math.max(0, Math.floor((Date.now() - new Date(f).getTime()) / 86400e3));
  }
  function telefono(t) {
    let d = String(t || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.startsWith("54")) d = d.slice(2);
    d = d.replace(/^0/, ""); if (d.startsWith("9")) d = d.slice(1);
    d = d.replace(/^(\d{2,4})15/, "$1");
    return "549" + d;
  }
  function enlaces(c) {
    const out = [];
    const ig = String(c.instagram || "").trim().replace(/^@/, "").replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").split(/[/?#\s]/)[0];
    if (ig) out.push(["Instagram", "https://instagram.com/" + encodeURIComponent(ig)]);
    const li = linkedinDe(c);
    if (li) out.push(["LinkedIn", /^https?:/i.test(li) ? li : "https://" + li]);
    const wa = telefono(c.whatsapp);
    if (wa.length > 10) out.push(["WhatsApp", "https://wa.me/" + wa]);
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email || "")) out.push(["Mail", "mailto:" + c.email]);
    const w = String(c.web || "").trim();
    if (w && !/linkedin\.com/i.test(w)) out.push(["Web", /^https?:/i.test(w) ? w : "https://" + w]);
    return out;
  }
  const usuarioIg = (c) => String(c.instagram || "").trim().replace(/^@/, "").replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").split(/[/?#\s]/)[0];
  // Enlace a la conversación según el canal del contacto (no envía nada: solo abre el chat o el perfil).
  function conversacion(c) {
    const ig = usuarioIg(c), li = linkedinDe(c), wa = telefono(c.whatsapp), mail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email || "") ? c.email : "";
    const op = {
      instagram: ig && "https://ig.me/m/" + encodeURIComponent(ig),
      linkedin: li && (/^https?:/i.test(li) ? li : "https://" + li),
      whatsapp: wa.length > 10 && "https://wa.me/" + wa,
      mail: mail && "mailto:" + mail + (c.asunto ? "?subject=" + encodeURIComponent(c.asunto) : ""),
    };
    const canal = canalDe(c);
    if (op[canal]) return [CANAL_TXT[canal], op[canal]];
    for (const k of ["instagram", "linkedin", "whatsapp", "mail"]) if (op[k]) return [CANAL_TXT[k], op[k]];
    return null;
  }
  const deHoy = (h) => String(h.fecha || "").slice(0, 10) === hoy() || new Date(new Date(h.fecha).getTime() - 3 * 3600e3).toISOString().slice(0, 10) === hoy();
  const pendienteHoy = (c) => ABIERTAS.includes(c.etapa) && (!!String(c.mensaje || "").trim() || (c.proximo_fecha && c.proximo_fecha <= hoy()));
  const resueltoHoy = (c) => (c.historial || []).some((h) => deHoy(h) && /^(Mensaje enviado|Hecho|Respondió|Perdido)/.test(h.texto || ""));
  async function copiar(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) {
      const a = document.createElement("textarea"); a.value = t; a.setAttribute("readonly", ""); a.style.position = "fixed"; a.style.opacity = "0";
      document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} a.remove(); return ok;
    }
  }
  const linksHtml = (c) => enlaces(c).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${t} de ${esc(nombre(c))}">${t}</a>`).join("");
  const nombre = (c) => c.marca || c.nombre || "(sin nombre)";
  const ordenar = (a, b) => (a.proximo_fecha || "9999").localeCompare(b.proximo_fecha || "9999") || tamano(b) - tamano(a);

  // ---------- API ----------
  async function api(metodo, cuerpo) {
    const r = await fetch("/api/crm", { method: metodo, headers: { "Content-Type": "application/json", "x-crm-clave": clave }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
    if (r.status === 401) throw new Error("clave");
    if (r.status === 503) throw new Error("sin_configurar");
    if (!r.ok) throw new Error("error");
    return r.json();
  }
  async function guardarCambios(id, cambios, texto, callado) {
    const r = await api("PATCH", { id, ...cambios });
    const i = contactos.findIndex((c) => c.id === r.contacto.id);
    if (i >= 0) contactos[i] = r.contacto;
    pintar(); if (!callado) avisar(texto || "Guardado", "ok");
  }
  function avisar(t, tipo, deshacer) {
    const a = $("#aviso"); if (!a) return;
    a.className = "aviso " + tipo; a.hidden = false;
    a.innerHTML = `<span>${esc(t)}</span>${deshacer ? `<button type="button" class="deshacer">Deshacer</button>` : ""}<button type="button" class="cerrar" aria-label="Cerrar aviso">✕</button>`;
    a.querySelector(".cerrar").onclick = () => (a.hidden = true);
    if (deshacer) a.querySelector(".deshacer").onclick = () => { a.hidden = true; deshacer(); };
    clearTimeout(avisar.t); if (tipo === "ok") avisar.t = setTimeout(() => (a.hidden = true), deshacer ? 8000 : 3000);
  }

  // ---------- estructura fija (no se redibuja al buscar) ----------
  function armar() {
    $("#app").innerHTML = `
      <div class="top"><h1>CRM · CreceConAds</h1><div class="acc">
        <button class="btn" id="nuevo" type="button">Agregar contacto</button>
        <label class="btn l" style="cursor:pointer">Importar pipeline (CSV)<input id="csv" type="file" accept=".csv" class="sr"></label>
        <button class="btn l" id="salir" type="button">Salir</button></div></div>
      <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
      <div class="kpis" id="kpis"></div>
      <div class="vistas" role="group" aria-label="Vista"><button type="button" data-vista="hoy">Hoy</button><button type="button" data-vista="tablero">Tablero</button></div>
      <div class="filtros">
        <label class="sr" for="q">Buscar</label><input id="q" type="search" placeholder="Buscar marca, web, Instagram…">
        <label class="sr" for="orig">Origen</label><select id="orig"><option value="">Todos los orígenes</option>${Object.entries(ORIGEN_TXT).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
        <label class="sr" for="can">Canal</label><select id="can"><option value="">Todos los canales</option>${Object.entries(CANAL_TXT).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
      </div>
      <div id="contenido"></div>`;
    $("#nuevo").onclick = () => abrir(null);
    $("#salir").onclick = () => { try { sessionStorage.removeItem("crm-clave"); } catch (e) {} location.reload(); };
    $("#q").oninput = (e) => { estado.q = e.target.value; pintar(); };
    $("#orig").onchange = (e) => { estado.origen = e.target.value; pintar(); };
    $("#can").onchange = (e) => { estado.canal = e.target.value; pintar(); };
    document.querySelectorAll("[data-vista]").forEach((b) => (b.onclick = () => { estado.vista = b.dataset.vista; pintar(); }));
    $("#csv").onchange = importar;
    // Un solo manejador para todo el contenido (filas, tarjetas, acciones).
    $("#contenido").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-acc]"); if (!b) return;
      const c = contactos.find((x) => x.id === b.dataset.id);
      if (b.dataset.acc === "plegar") { estado.plegadas[b.dataset.etapa] = !estado.plegadas[b.dataset.etapa]; return pintar(); }
      if (!c) return;
      if (b.dataset.acc === "abrir") abrir(c, b);
      else if (b.dataset.acc === "copiar") copiarMensaje(c, b);
      else if (b.dataset.acc === "enviado") enviado(c, b);
      else if (b.dataset.acc === "conversacion") { if (b.getAttribute("aria-disabled") === "true") ev.preventDefault(); }
      else rapida(b.dataset.acc, c, b);
    });
  }

  function visibles() {
    const q = estado.q.toLowerCase().trim();
    return contactos.filter((c) => (!estado.origen || c.origen === estado.origen) && (!estado.canal || canalDe(c) === estado.canal) &&
      (!q || [c.nombre, c.marca, c.web, c.instagram, c.linkedin, c.vende, c.notas, c.proximo_paso, c.mensaje].join(" ").toLowerCase().includes(q)));
  }

  function pintar() {
    document.querySelectorAll("[data-vista]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.vista === estado.vista));
    const cuenta = (f) => contactos.filter(f).length;
    const abiertos = contactos.filter((c) => ABIERTAS.includes(c.etapa));
    $("#kpis").innerHTML = `
      <div class="kpi"><b>${contactos.length}</b><span>contactos</span></div>
      <div class="kpi"><b>${abiertos.length}</b><span>abiertos</span></div>
      <div class="kpi"><b>${cuenta((c) => ABIERTAS.includes(c.etapa) && c.proximo_fecha && c.proximo_fecha < hoy())}</b><span>vencidos</span></div>
      <div class="kpi"><b>${cuenta((c) => c.etapa === "Propuesta")}</b><span>con propuesta abierta</span></div>
      <div class="kpi"><b>${cuenta((c) => c.etapa === "Ganado")}</b><span>clientes ganados</span></div>`;
    const vis = visibles();
    $("#contenido").innerHTML = estado.vista === "hoy" ? vistaHoy(vis) : vistaTablero(vis);
  }

  function metaHtml(c) {
    const canal = canalDe(c), dias = ultimoContacto(c), vence = c.proximo_fecha && c.proximo_fecha < hoy() && ABIERTAS.includes(c.etapa);
    return `<span class="meta">${canal ? `<span class="tag c-${canal}">${CANAL_TXT[canal]}</span>` : ""}<span class="tag">${esc(c.etapa)}</span>
      ${c.proximo_fecha ? `<span class="tag ${vence ? "vence" : ""}">${vence ? "venció " : ""}${esc(c.proximo_fecha.split("-").reverse().slice(0, 2).join("/"))}</span>` : ""}
      ${dias != null ? `<span>hace ${dias} ${dias === 1 ? "día" : "días"}</span>` : ""}${tamano(c) ? `<span>${tamano(c)} anuncios</span>` : ""}</span>`;
  }
  const accionesHtml = (c) => `<div class="acciones">${linksHtml(c)}
      <button type="button" class="hecho" data-acc="hecho" data-id="${c.id}">Hecho</button>
      <button type="button" data-acc="respondio" data-id="${c.id}">Respondió</button>
      <button type="button" data-acc="mover" data-id="${c.id}">Mover</button>
      ${c.etapa !== "Perdido" ? `<button type="button" class="perdido" data-acc="perdido" data-id="${c.id}">Perdido</button>` : ""}</div>`;
  const abrirHtml = (c) => `<button type="button" class="fila-abrir" data-acc="abrir" data-id="${c.id}"><b>${esc(nombre(c))}</b>
      <span class="paso">${esc(c.proximo_paso || "Sin próximo paso")}</span>${metaHtml(c)}</button>`;

  function tandaHtml(vis) {
    const conMsj = vis.filter((c) => ABIERTAS.includes(c.etapa) && String(c.mensaje || "").trim()).sort(ordenar);
    const pend = contactos.filter(pendienteHoy).length;
    const total = pend + contactos.filter((c) => !pendienteHoy(c) && resueltoHoy(c)).length;
    const pct = total ? Math.round(((total - pend) / total) * 100) : 100;
    const cab = `<p class="restan" role="status">${total ? `Te quedan ${pend} de ${total} para hoy` : "No hay nada para hoy"}<span class="barra" aria-hidden="true"><i style="width:${pct}%"></i></span></p>`;
    if (!conMsj.length) return `<section class="tanda" aria-label="Tanda del día">${cab}<p class="vacio">No hay mensajes listos para enviar.</p></section>`;
    return `<section class="tanda" aria-label="Tanda del día">${cab}<h2>Mensajes para enviar <span class="n">${conMsj.length}</span></h2>${conMsj.map((c) => {
      const conv = conversacion(c), canal = canalDe(c);
      return `<article class="msj" aria-label="${esc(nombre(c))}">${abrirHtml(c)}
        ${c.asunto ? `<p class="asunto"><b>Asunto:</b> ${esc(c.asunto)}</p>` : ""}<p class="texto">${esc(c.mensaje)}</p>
        <div class="tres">
          <button type="button" class="copiar" data-acc="copiar" data-id="${c.id}">Copiar mensaje</button>
          ${conv ? `<a href="${esc(conv[1])}" target="_blank" rel="noopener" data-acc="conversacion" data-id="${c.id}">Abrir conversación<span class="sr"> en ${conv[0]}</span></a>`
                 : `<a role="link" aria-disabled="true" data-acc="conversacion" data-id="${c.id}" title="Falta el usuario o el contacto del canal">Sin enlace${canal ? " de " + CANAL_TXT[canal] : ""}</a>`}
          <button type="button" class="enviado" data-acc="enviado" data-id="${c.id}">Enviado</button>
        </div>
        <div class="secund"><button type="button" data-acc="respondio" data-id="${c.id}">Respondió</button><button type="button" data-acc="abrir" data-id="${c.id}">Ficha</button></div></article>`;
    }).join("")}</section>`;
  }

  function vistaHoy(vis) {
    const ab = vis.filter((c) => ABIERTAS.includes(c.etapa) && !String(c.mensaje || "").trim());
    const listas = [
      ["vencidos", "Vencidos", ab.filter((c) => c.proximo_fecha && c.proximo_fecha < hoy()).sort(ordenar), "No hay seguimientos vencidos."],
      ["parahoy", "Para hoy", ab.filter((c) => c.proximo_fecha === hoy()).sort(ordenar), "Nada agendado para hoy."],
      ["sinpaso", "Abiertos sin próximo paso", ab.filter((c) => !c.proximo_fecha).sort((a, b) => tamano(b) - tamano(a)), "Todos los abiertos tienen próximo paso."],
    ];
    return `<div class="hoy">${tandaHtml(vis)}${listas.map(([cl, t, l, v]) => `<section class="lista ${cl}"><h2>${t} <span class="n">${l.length}</span></h2>
      ${l.length ? `<ul class="filas">${l.map((c) => `<li class="fila">${abrirHtml(c)}${accionesHtml(c)}</li>`).join("")}</ul>` : `<p class="vacio">${v}</p>`}</section>`).join("")}</div>`;
  }

  function vistaTablero(vis) {
    return `<div class="tablero">${ETAPAS.map((e) => {
      const l = vis.filter((c) => c.etapa === e).sort(ordenar);
      if (estado.plegadas[e]) return `<section class="col plegada"><button type="button" class="plegar" data-acc="plegar" data-etapa="${e}" aria-expanded="false">${e} <span>${l.length} ▸</span></button></section>`;
      const cab = e === "Ganado" || e === "Perdido"
        ? `<button type="button" class="plegar" data-acc="plegar" data-etapa="${e}" aria-expanded="true">${e} <span>${l.length} ▾</span></button>`
        : `<h2>${e}<span>${l.length}</span></h2>`;
      return `<section class="col">${cab}<div class="cuerpo">${l.map((c) => `<article class="card">${abrirHtml(c)}${accionesHtml(c)}</article>`).join("") || `<p class="vacio">—</p>`}</div></section>`;
    }).join("")}</div>`;
  }

  // ---------- tanda: copiar y enviado ----------
  async function copiarMensaje(c, b) {
    const ok = await copiar(String(c.mensaje || ""));
    if (!ok) return avisar("No se pudo copiar. Abrí la ficha y copialo a mano.", "err");
    b.textContent = "Copiado ✓"; b.classList.add("ok");
    setTimeout(() => { if (document.contains(b)) { b.textContent = "Copiar mensaje"; b.classList.remove("ok"); } }, 2500);
  }
  async function enviado(c, b) {
    const antes = { mensaje: c.mensaje || "", asunto: c.asunto || "", etapa: c.etapa, proximo_paso: c.proximo_paso || "", proximo_fecha: c.proximo_fecha || "" };
    b.disabled = true;
    try {
      await guardarCambios(c.id, { nota: "Mensaje enviado" + (antes.asunto ? " (asunto: " + antes.asunto + ")" : "") + ":\n" + antes.mensaje, mensaje: "", asunto: "",
        etapa: c.etapa === "Nuevo" ? "Contactado" : c.etapa, proximo_paso: "Esperar respuesta", proximo_fecha: sumar(3) }, "", true);
      avisar("Enviado · " + nombre(c), "ok", async () => {
        try { await guardarCambios(c.id, { ...antes, nota: "Deshecho: el mensaje no se había enviado" }, "Deshecho"); }
        catch (e) { avisar("No se pudo deshacer. Abrí la ficha y corregilo.", "err"); }
      });
      const sig = document.querySelector(".msj [data-acc=copiar]"); if (sig) sig.focus();
    } catch (e) { b.disabled = false; avisar("No se pudo guardar. Revisá la conexión y probá de nuevo.", "err"); }
  }

  // ---------- acciones rápidas ----------
  let rapidaCtx = null;
  function rapida(tipo, c, origen) {
    rapidaCtx = { tipo, c, origen };
    const t = { hecho: "Hecho", mover: "Mover de etapa", perdido: "Marcar como perdido", respondio: "Respondió" }[tipo];
    $("#rapida-tit").textContent = t + " · " + nombre(c);
    let html = "";
    if (tipo === "hecho") html = `<label>¿Qué hiciste?<input id="r-nota" placeholder="Ej.: le mandé el DM de seguimiento"></label>
      <label style="margin-top:10px">Próximo paso<input id="r-paso" value="${esc(c.proximo_paso || "")}"></label>
      <label style="margin-top:10px">Fecha del próximo paso<input id="r-fecha" type="date" value="${sumar(3)}"></label>
      <div class="atajos" role="group" aria-label="Atajos de fecha"><button type="button" data-d="3">+3 días</button><button type="button" data-d="7">+7 días</button><button type="button" data-d="0">Sin fecha</button></div>`;
    if (tipo === "mover") html = `<label>Etapa<select id="r-etapa">${ETAPAS.map((e) => `<option ${e === c.etapa ? "selected" : ""}>${e}</option>`).join("")}</select></label>
      <label style="margin-top:10px">Nota (opcional)<input id="r-nota"></label>`;
    if (tipo === "respondio") html = `<label>Pegá la respuesta<textarea id="r-resp" rows="6" placeholder="Lo que te contestó"></textarea></label>`;
    if (tipo === "perdido") html = `<label>Motivo<input id="r-motivo" placeholder="Ej.: no respondió, ya tiene agencia" required></label>`;
    $("#rapida-cuerpo").innerHTML = html;
    $("#rapida-cuerpo").querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => { $("#r-fecha").value = b.dataset.d === "0" ? "" : sumar(+b.dataset.d); }));
    $("#rapida").showModal();
    const f = $("#rapida-cuerpo").querySelector("input,select,textarea"); if (f) f.focus();
  }
  $("#rapida-form").addEventListener("submit", async (ev) => {
    if (!ev.submitter || ev.submitter.value !== "guardar") return;
    ev.preventDefault();
    const { tipo, c } = rapidaCtx; let cambios = {}, texto = "Guardado";
    if (tipo === "hecho") { const n = $("#r-nota").value.trim(); cambios = { nota: "Hecho" + (n ? ": " + n : ""), proximo_paso: $("#r-paso").value.trim(), proximo_fecha: $("#r-fecha").value }; texto = "Registrado"; }
    if (tipo === "mover") { cambios = { etapa: $("#r-etapa").value, nota: $("#r-nota").value.trim() }; texto = "Movido a " + cambios.etapa; }
    if (tipo === "respondio") { const r = $("#r-resp").value.trim(); if (!r) return $("#r-resp").focus(); cambios = { nota: "Respondió:\n" + r, proximo_paso: "Respondió: preparar contestación", proximo_fecha: hoy() }; texto = "Respuesta guardada"; }
    if (tipo === "perdido") { const m = $("#r-motivo").value.trim(); if (!m) return $("#r-motivo").focus(); cambios = { etapa: "Perdido", motivo_perdida: m, proximo_fecha: "", nota: "Perdido: " + m }; texto = "Marcado como perdido"; }
    $("#rapida-ok").disabled = true;
    try { await guardarCambios(c.id, cambios, texto); $("#rapida").close(); }
    catch (e) { avisar("No se pudo guardar. Revisá la conexión y probá de nuevo.", "err"); }
    $("#rapida-ok").disabled = false;
  });
  $("#rapida").addEventListener("close", () => { if (rapidaCtx && rapidaCtx.origen && document.contains(rapidaCtx.origen)) rapidaCtx.origen.focus(); });

  // ---------- ficha ----------
  const CAMPOS = ["nombre", "marca", "canal", "origen", "instagram", "linkedin", "web", "whatsapp", "email", "vende", "inversion", "etapa", "proximo_paso", "proximo_fecha", "valor", "motivo_perdida", "notas", "mensaje", "asunto"];
  $("#f-etapa").innerHTML = ETAPAS.map((e) => `<option>${e}</option>`).join("");
  let fichaOrigen = null;
  function abrir(c, origen) {
    actual = c; fichaOrigen = origen || null; sucio = false;
    $("#ficha-tit").textContent = c ? nombre(c) : "Nuevo contacto";
    CAMPOS.forEach((k) => { $("#f-" + k).value = c ? (k === "canal" ? canalDe(c) : k === "linkedin" ? linkedinDe(c) : c[k] || "") : (k === "etapa" ? "Nuevo" : k === "origen" ? "otro" : ""); });
    $("#f-nota").value = "";
    $("#ficha-enlaces").innerHTML = c ? linksHtml(c).replace(/<a /g, '<a class="btn l" ') : "";
    $("#f-hist").innerHTML = c && c.historial ? c.historial.slice().reverse().map((h) => `<p><time>${esc(String(h.fecha).slice(0, 16).replace("T", " "))}</time> ${esc(h.texto)}</p>`).join("") : "";
    $("#f-eliminar").hidden = !c;
    $("#ficha").showModal();
  }
  $("#ficha-form").addEventListener("input", () => (sucio = true));
  $("#ficha").addEventListener("cancel", (ev) => { if (sucio && !window.confirm("Tenés cambios sin guardar. ¿Cerrar igual?")) ev.preventDefault(); });
  $("#ficha").addEventListener("close", () => { if (fichaOrigen && document.contains(fichaOrigen)) fichaOrigen.focus(); });
  $("#ficha-form").addEventListener("submit", async (ev) => {
    if (!ev.submitter || ev.submitter.value !== "guardar") {
      if (sucio && !window.confirm("Tenés cambios sin guardar. ¿Cerrar igual?")) ev.preventDefault();
      return;
    }
    ev.preventDefault();
    const d = Object.fromEntries(CAMPOS.map((k) => [k, $("#f-" + k).value]));
    d.nota = $("#f-nota").value;
    $("#f-guardar").disabled = true;
    try {
      const r = actual ? await api("PATCH", { id: actual.id, ...d }) : await api("POST", d);
      const i = contactos.findIndex((c) => c.id === r.contacto.id);
      if (i >= 0) contactos[i] = r.contacto; else contactos.unshift(r.contacto);
      sucio = false; $("#ficha").close(); pintar(); avisar("Guardado", "ok");
    } catch (e) { avisar("No se pudo guardar. Revisá la conexión y probá de nuevo.", "err"); }
    $("#f-guardar").disabled = false;
  });
  $("#f-eliminar").addEventListener("click", async () => {
    if (!actual || !window.confirm(`¿Eliminar a «${nombre(actual)}» del CRM? No se puede deshacer.`)) return;
    try {
      await api("DELETE", { id: actual.id });
      contactos = contactos.filter((c) => c.id !== actual.id);
      sucio = false; fichaOrigen = null; $("#ficha").close(); pintar(); avisar("Contacto eliminado", "ok");
    } catch (e) { avisar("No se pudo eliminar. Probá de nuevo.", "err"); }
  });

  // ---------- importar pipeline.csv ----------
  function csv(texto) {
    const filas = []; let f = [], v = "", q = false;
    for (let i = 0; i < texto.length; i++) {
      const ch = texto[i];
      if (q) { if (ch === '"' && texto[i + 1] === '"') { v += '"'; i++; } else if (ch === '"') q = false; else v += ch; }
      else if (ch === '"') q = true; else if (ch === ",") { f.push(v); v = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && texto[i + 1] === "\n") i++; f.push(v); filas.push(f); f = []; v = ""; }
      else v += ch;
    }
    if (v || f.length) { f.push(v); filas.push(f); }
    const cab = filas.shift() || [];
    return filas.filter((r) => r.length > 1).map((r) => Object.fromEntries(cab.map((k, i) => [k.trim(), (r[i] || "").trim()])));
  }
  const ETAPA_PIPE = { mensaje_listo: "Nuevo", enviado: "Contactado", ideas_entregadas: "Ideas enviadas", propuesta_enviada: "Propuesta", perdido: "Perdido", descartado: "Perdido" };
  async function importar(ev) {
    const archivo = ev.target.files[0]; if (!archivo) return;
    const lote = csv(await archivo.text()).filter((r) => r.marca).map((r) => ({
      marca: r.marca, instagram: r.instagram, web: r.web, origen: "prospeccion", canal: "instagram",
      etapa: ETAPA_PIPE[r.estado] || "Nuevo", proximo_paso: r.proximo_paso,
      notas: [r.dolor && "Dolor: " + r.dolor, r.fit && "Fit: " + r.fit, r.respuesta && "Respuesta: " + r.respuesta, r.notas].filter(Boolean).join("\n"),
      motivo_perdida: ETAPA_PIPE[r.estado] === "Perdido" ? r.respuesta || r.estado : "",
      nota_inicial: "Importado del pipeline (estado: " + r.estado + (r.fecha_envio ? ", DM del " + r.fecha_envio : "") + ")",
    }));
    try { const r = await api("POST", { importar: lote }); await cargar(); avisar(`Importados ${r.importados} contactos nuevos (los repetidos se saltean).`, "ok"); }
    catch (e) { avisar("No se pudo importar. Revisá el archivo.", "err"); }
    ev.target.value = "";
  }

  // ---------- entrada ----------
  async function cargar() { const d = await api("GET"); contactos = d.contactos || []; pintar(); }
  async function entrar() {
    const err = $("#login-err");
    try {
      const d = await api("GET"); contactos = d.contactos || [];
      try { sessionStorage.setItem("crm-clave", clave); } catch (e) {}
      armar(); pintar();
    } catch (e) {
      if (err) { err.hidden = false; err.textContent = e.message === "sin_configurar" ? "El CRM todavía no tiene clave cargada en Vercel (CRM_CLAVE)." : e.message === "clave" ? "Clave incorrecta." : "No se pudo cargar. Probá de nuevo."; }
    }
  }
  $("#login").addEventListener("submit", (ev) => { ev.preventDefault(); clave = $("#clave").value; entrar(); });
  if (clave) entrar();
})();
</script>
</body>
</html>
